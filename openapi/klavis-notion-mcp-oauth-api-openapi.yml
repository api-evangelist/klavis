openapi: 3.2.0
info:
  title: Klavis AI (https://www.klavis.ai) Notion MCP OAUTH API
  description: Klavis AI - Open Source MCP Integrations for AI Applications
  version: 0.1.0
servers:
- url: https://api.klavis.ai
  description: US Production server
- url: https://api.eu.klavis.ai
  description: EU Production server
tags:
- name: notion-mcp-oauth
paths:
  /oauth/notion-mcp/authorize:
    get:
      tags:
      - notion-mcp-oauth
      summary: Authorize Notion MCP
      operationId: authorizenotion_mcp_oauth
      parameters:
      - name: sandbox_id
        in: query
        required: true
        schema:
          type: string
          description: Unique identifier for the sandbox connection
          title: Sandbox Id
        description: Unique identifier for the sandbox connection
      - name: redirect_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional URL to redirect to after authorization
          title: Redirect Url
        description: Optional URL to redirect to after authorization
      - name: force_refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Force re-authorization even if valid tokens exist
          default: true
          title: Force Refresh
        description: Force re-authorization even if valid tokens exist
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/notion-mcp/refresh_token:
    post:
      tags:
      - notion-mcp-oauth
      summary: Refresh Notion MCP Token
      operationId: refresh_notion_mcp_oauth_token
      parameters:
      - name: sandbox_id
        in: query
        required: true
        schema:
          type: string
          description: Unique identifier for the sandbox connection
          title: Sandbox Id
        description: Unique identifier for the sandbox connection
      - name: proxy
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: HTTP proxy URL for token refresh
          title: Proxy
        description: HTTP proxy URL for token refresh
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Your Klavis AI API key.
      scheme: bearer
      x-fern-bearer:
        name: api_key
