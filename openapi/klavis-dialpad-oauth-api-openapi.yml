openapi: 3.2.0
info:
  title: Klavis AI (https://www.klavis.ai) Dialpad OAUTH API
  description: Klavis AI - Open Source MCP Integrations for AI Applications
  version: 0.1.0
servers:
- url: https://api.klavis.ai
  description: US Production server
- url: https://api.eu.klavis.ai
  description: EU Production server
tags:
- name: dialpad-oauth
paths:
  /oauth/dialpad/authorize:
    get:
      tags:
      - dialpad-oauth
      summary: Authorize Dialpad
      description: 'Start Dialpad OAuth flow


        Parameters:

        - instance_id: Identifier for the instance requesting authorization

        - client_id: Optional client ID for white labeling

        - scope: Optional scopes to request (space-separated)

        - redirect_url: Optional URL to redirect to after authorization completes

        - code_challenge: PKCE code challenge for enhanced security

        - code_challenge_method: PKCE code challenge method'
      operationId: authorizeDialpad
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
          description: Unique identifier for the client instance requesting authorization
          title: Instance Id
        description: Unique identifier for the client instance requesting authorization
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client ID for white labeling, if not provided will use default credentials
          title: Client Id
        description: Client ID for white labeling, if not provided will use default credentials
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional OAuth scopes to request (space-separated string)
          title: Scope
        description: Optional OAuth scopes to request (space-separated string)
      - name: redirect_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional URL to redirect to after authorization completes
          title: Redirect Url
        description: Optional URL to redirect to after authorization completes
      - name: code_challenge
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: PKCE code challenge for enhanced security
          title: Code Challenge
        description: PKCE code challenge for enhanced security
      - name: code_challenge_method
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'PKCE code challenge method (default: S256)'
          default: S256
          title: Code Challenge Method
        description: 'PKCE code challenge method (default: S256)'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Your Klavis AI API key.
      scheme: bearer
      x-fern-bearer:
        name: api_key
x-provenance:
  method: harvested
  publisher: Klavis AI
  source: https://api.klavis.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
