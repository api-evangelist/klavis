openapi: 3.2.0
info:
  title: Klavis AI (https://www.klavis.ai) Outlook OAUTH API
  description: Klavis AI - Open Source MCP Integrations for AI Applications
  version: 0.1.0
servers:
- url: https://api.klavis.ai
  description: US Production server
- url: https://api.eu.klavis.ai
  description: EU Production server
tags:
- name: outlook-oauth
paths:
  /oauth/outlook/authorize:
    get:
      tags:
      - outlook-oauth
      summary: Authorize Outlook
      operationId: authorizeOutlook
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
          description: Unique identifier for the client instance requesting authorization
          title: Instance Id
        description: Unique identifier for the client instance requesting authorization
      - name: client_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Client ID for white labeling, if not provided will use default credentials
          title: Client Id
        description: Client ID for white labeling, if not provided will use default credentials
      - name: scope
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional OAuth scopes to request (space-separated string)
          title: Scope
        description: Optional OAuth scopes to request (space-separated string)
      - name: redirect_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional URL to redirect to after authorization completes
          title: Redirect Url
        description: Optional URL to redirect to after authorization completes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/outlook/refresh_token:
    post:
      tags:
      - outlook-oauth
      summary: Refresh Token
      operationId: refresh_token_oauth_outlook_refresh_token_post
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
          description: Instance ID for which to refresh the token
          title: Instance Id
        description: Instance ID for which to refresh the token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureADOAuthSuccessResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureADOAuthErrorResponse'
          description: Bad Request
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AzureADOAuthErrorResponse:
      properties:
        error:
          type: string
          title: Error
          description: Error message from the OAuth process
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Additional error message
      type: object
      required:
      - error
      title: AzureADOAuthErrorResponse
    AzureADOAuthSuccessResponse:
      properties:
        status:
          type: string
          title: Status
          description: Status of the OAuth process
          default: success
        message:
          type: string
          title: Message
          description: Success message
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: Additional data related to the response
      type: object
      required:
      - message
      title: AzureADOAuthSuccessResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Your Klavis AI API key.
      scheme: bearer
      x-fern-bearer:
        name: api_key
x-provenance:
  method: harvested
  publisher: Klavis AI
  source: https://api.klavis.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
