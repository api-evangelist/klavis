openapi: 3.2.0
info:
  title: Klavis AI (https://www.klavis.ai) Jotform OAUTH API
  description: Klavis AI - Open Source MCP Integrations for AI Applications
  version: 0.1.0
servers:
- url: https://api.klavis.ai
  description: US Production server
- url: https://api.eu.klavis.ai
  description: EU Production server
tags:
- name: jotform-oauth
paths:
  /oauth/jotform/authorize:
    get:
      tags:
      - jotform-oauth
      summary: Authorize Jotform
      description: Start OAuth flow and redirect to authorization page.
      operationId: authorizejotform_oauth
      parameters:
      - name: instance_id
        in: query
        required: true
        schema:
          type: string
          description: Unique identifier for the MCP connection
          title: Instance Id
        description: Unique identifier for the MCP connection
      - name: redirect_url
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional URL to redirect to after authorization
          title: Redirect Url
        description: Optional URL to redirect to after authorization
      - name: force_refresh
        in: query
        required: false
        schema:
          type: boolean
          description: Force re-authorization even if valid tokens exist
          default: true
          title: Force Refresh
        description: Force re-authorization even if valid tokens exist
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      description: Your Klavis AI API key.
      scheme: bearer
      x-fern-bearer:
        name: api_key
x-provenance:
  method: harvested
  publisher: Klavis AI
  source: https://api.klavis.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
