components:
  schemas:
    BigQueryField-Output:
      properties:
        name:
          type: string
          title: Name
          description: Field name
        type:
          type: string
          title: Type
          description: Field type (STRING, INTEGER, FLOAT, BOOLEAN, TIMESTAMP, RECORD, etc.)
        mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Mode
          description: Field mode (NULLABLE, REQUIRED, REPEATED)
          default: NULLABLE
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Field description
        fields:
          anyOf:
          - items:
              $ref: '#/components/schemas/BigQueryField-Output'
            type: array
          - type: 'null'
          title: Fields
          description: Nested fields for RECORD type
      type: object
      required:
      - name
      - type
      title: BigQueryField
      description: Schema field for a BigQuery table
    PosteEmailUserData-Input:
      properties:
        emails:
          anyOf:
          - items:
              $ref: '#/components/schemas/PosteEmail-Input'
            type: array
          - type: 'null'
          title: Emails
          description: List of email messages for this user
      type: object
      title: PosteEmailUserData
      description: Email data for a single user.
    CanvasQuizQuestion-Input:
      properties:
        question_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Question Name
          description: Short name/label for the question
        question_text:
          type: string
          title: Question Text
          description: The question text (supports HTML)
        question_type:
          type: string
          title: Question Type
          description: 'Question type: multiple_choice_question, true_false_question, short_answer_question, essay_question, etc.'
          default: multiple_choice_question
        points_possible:
          type: number
          title: Points Possible
          description: Points for this question
          default: 1.0
        answers:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Answers
          description: Answer options. Each dict has 'answer_text' and 'answer_weight' (100 = correct, 0 = wrong)
      type: object
      required:
      - question_text
      title: CanvasQuizQuestion
      description: A single quiz question.
    LocalSandboxMCPServer:
      type: string
      enum:
      - filesystem
      - git
      - terminal
      - desktop-commander
      - arxiv
      - excel
      - word
      - powerpoint
      - code-executor
      - code-runner
      - pdf-tools
      - google_cloud
      - poste_email_toolathlon
      - canvas
