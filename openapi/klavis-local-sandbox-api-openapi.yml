openapi: 3.2.0
info:
  title: Klavis AI (https://www.klavis.ai) Local Sandbox API
  description: Klavis AI - Open Source MCP Integrations for AI Applications
  version: 0.1.0
servers:
- url: https://api.klavis.ai
  description: US Production server
- url: https://api.eu.klavis.ai
  description: EU Production server
tags:
- name: local-sandbox
paths:
  /local-sandbox:
    get:
      tags:
      - local-sandbox
      summary: List local sandboxes
      description: Lists all active local sandbox environments owned by the user.
      operationId: list_local_sandboxes_local_sandbox_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListLocalSandboxesResponse'
      security:
      - HTTPBearer: []
    post:
      tags:
      - local-sandbox
      summary: Acquire a local sandbox
      description: 'Initializes a specialized Virtual Machine environment (Local Sandbox) that hosts multiple interconnected MCP servers. Optionally specify a benchmark (e.g., ''Toolathlon'') to configure the sandbox. IMPORTANT: The benchmark parameter may affect BOTH (1) the initial data environment (e.g., preloaded data or pre-configured state for supported servers) AND (2) the MCP server implementation itself — some servers may be routed to a benchmark-specific MCP server with potentially different tools or behaviors.'
      operationId: acquire_local_sandbox_local_sandbox_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquireLocalSandboxRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquireLocalSandboxResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /local-sandbox/{local_sandbox_id}:
    delete:
      tags:
      - local-sandbox
      summary: Release a local sandbox
      description: Releases the local sandbox VM and all associated servers, cleaning up the shared environment.
      operationId: release_local_sandbox_local_sandbox__local_sandbox_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the local sandbox to release
          title: Local Sandbox Id
        description: The ID of the local sandbox to release
      - name: is_ttl
        in: query
        required: false
        schema:
          type: boolean
          description: Flag indicating if this is a TTL release task
          default: false
          title: Is Ttl
        description: Flag indicating if this is a TTL release task
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - local-sandbox
      summary: Get local sandbox details
      description: Retrieves details about a local sandbox environment, including its status and all running servers.
      operationId: get_local_sandbox_local_sandbox__local_sandbox_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the local sandbox to retrieve
          title: Local Sandbox Id
        description: The ID of the local sandbox to retrieve
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalSandboxInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/reset:
    post:
      tags:
      - local-sandbox
      summary: Reset local sandbox to initial state
      description: Resets the state of the local sandbox VM and all its servers to their initial state.
      operationId: reset_local_sandbox_local_sandbox__local_sandbox_id__reset_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The ID of the local sandbox to reset
          title: Local Sandbox Id
        description: The ID of the local sandbox to reset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/upload-url:
    post:
      tags:
      - local-sandbox
      summary: Get URL to upload your data
      description: Generates a signed URL to upload a `tar.gz` archive containing your workspace files. Once uploaded, use the `/initialize` endpoint to unpack it into the sandbox.
      operationId: get_upload_url_local_sandbox__local_sandbox_id__upload_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region for the signed URL. Use 'asia' for users in China/Asia to upload to a nearby bucket (lower latency). The file is accessible from any region over Google's private backbone. Defaults to 'us'.
          default: us
        description: GCS bucket region for the signed URL. Use 'asia' for users in China/Asia to upload to a nearby bucket (lower latency). The file is accessible from any region over Google's private backbone. Defaults to 'us'.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/initialize:
    post:
      tags:
      - local-sandbox
      summary: Initialize sandbox from your uploaded data
      description: Extracts the uploaded `tar.gz` archive into the sandbox workspace. This must be called after successfully uploading the file using the URL from `/upload-url`.
      operationId: initialize_local_sandbox_local_sandbox__local_sandbox_id__initialize_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region where the archive was uploaded. Must match the region used in the `/upload-url` call. Defaults to 'us'.
          default: us
        description: GCS bucket region where the archive was uploaded. Must match the region used in the `/upload-url` call. Defaults to 'us'.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeSandboxResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/dump:
    get:
      tags:
      - local-sandbox
      summary: Download sandbox data
      description: Creates a `tar.gz` archive of the current workspace and provides a temporary download URL. Useful for saving your work or exporting the sandbox state.
      operationId: dump_local_sandbox_local_sandbox__local_sandbox_id__dump_get
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region for the download URL. Use 'asia' for users in China/Asia for faster downloads from a nearby bucket. Defaults to 'us'.
          default: us
        description: GCS bucket region for the download URL. Use 'asia' for users in China/Asia for faster downloads from a nearby bucket. Defaults to 'us'.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DumpUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/execution-upload-url:
    post:
      tags:
      - local-sandbox
      summary: Get a pre-signed URL to upload an execution archive
      description: Returns a pre-signed GCS PUT URL so the caller can upload a tar.gz archive containing `main.py`, `requirements.txt`, etc. for later execution.
      operationId: get_execution_upload_url_local_sandbox__local_sandbox_id__execution_upload_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region for the signed URL. Defaults to 'us'.
          default: us
        description: GCS bucket region for the signed URL. Defaults to 'us'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionUploadUrlRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionUploadUrlResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/execute:
    post:
      tags:
      - local-sandbox
      summary: Execute a script inside the sandbox
      description: Computes the internal GCS archive URL from the sandbox ID and execution name, then triggers the sandbox executor to download, install dependencies, and execute `main.py`. The execution runs in the background — poll `/execution-logs` to track progress. The archive must first be uploaded via `/execution-upload-url`.
      operationId: execute_in_sandbox_local_sandbox__local_sandbox_id__execute_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region where the archive was uploaded. Defaults to 'us'.
          default: us
        description: GCS bucket region where the archive was uploaded. Defaults to 'us'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/execution-status:
    get:
      tags:
      - local-sandbox
      summary: Get execution status
      description: 'Returns the current status of an execution: pending, running, completed, or failed.'
      operationId: get_execution_status_local_sandbox__local_sandbox_id__execution_status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: execution_name
        in: query
        required: true
        schema:
          type: string
          description: Name of the execution to check status for
          title: Execution Name
        description: Name of the execution to check status for
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/execution-logs:
    get:
      tags:
      - local-sandbox
      summary: Poll execution logs
      description: Returns execution status and new log content since the provided byte cursor. Call repeatedly with the returned cursor to stream logs.
      operationId: get_execution_logs_local_sandbox__local_sandbox_id__execution_logs_get
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: execution_name
        in: query
        required: true
        schema:
          type: string
          description: Name of the execution to get logs for
          title: Execution Name
        description: Name of the execution to get logs for
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Byte offset to start reading from
          default: 0
          title: Cursor
        description: Byte offset to start reading from
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionLogsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/{local_sandbox_id}/export-artifacts:
    post:
      tags:
      - local-sandbox
      summary: Export execution artifacts
      description: Zips the execution directory and uploads it to GCS. Returns a signed download URL for the exported artifacts.
      operationId: export_artifacts_local_sandbox__local_sandbox_id__export_artifacts_post
      security:
      - HTTPBearer: []
      parameters:
      - name: local_sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The local sandbox identifier
          title: Local Sandbox Id
        description: The local sandbox identifier
      - name: region
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GCSRegion'
          description: GCS bucket region for the signed URL. Defaults to 'us'.
          default: us
        description: GCS bucket region for the signed URL. Defaults to 'us'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportArtifactsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportArtifactsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/google_cloud/{sandbox_id}/initialize:
    post:
      tags:
      - local-sandbox
      summary: Initialize google_cloud sandbox with data
      description: Initialize the sandbox with google_cloud-specific data following the defined schema.
      operationId: initialize_sandbox_local_sandbox_google_cloud__sandbox_id__initialize_post
      security:
      - HTTPBearer: []
      parameters:
      - name: sandbox_id
        in: path
        required: true
        schema:
          type: string
          description: The unique sandbox identifier
          title: Sandbox Id
        description: The unique sandbox identifier
      - name: init_default_data
        in: query
        required: false
        schema:
          type: boolean
          description: If true, use default test data for initialization
          default: false
          title: Init Default Data
        description: If true, use default test data for initialization
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/GoogleCloudData-Input'
              - type: 'null'
              title: Request Body
            examples:
              default:
                summary: Example initialization data
                value:
                  datasets:
                  - id: sales_analytics
                    description: Sales and revenue analytics data warehouse
                    location: US
                  - id: customer_data
                    description: Customer information and interactions
                    location: US
                  - id: product_catalog
                    description: Product inventory and catalog data
                    location: EU
                  tables:
                  - dataset_id: sales_analytics
                    id: daily_sales
                    description: Daily sales transactions
                    fields:
                    - name: transaction_id
                      type: STRING
                      mode: REQUIRED
                      description: Unique transaction identifier
                    - name: sale_date
                      type: DATE
                      mode: REQUIRED
                      description: Date of sale
                    - name: product_id
                      type: STRING
                      mode: REQUIRED
                      description: Product identifier
                    - name: quantity
                      type: INTEGER
                      mode: REQUIRED
                      description: Quantity sold
                    - name: unit_price
                      type: FLOAT
                      mode: REQUIRED
                      description: Price per unit
                    - name: total_amount
                      type: FLOAT
                      mode: REQUIRED
                      description: Total sale amount
                    - name: region
                      type: STRING
                      mode: NULLABLE
                      description: Sales region
                  - dataset_id: sales_analytics
                    id: monthly_revenue
                    description: Monthly revenue aggregation
                    fields:
                    - name: month
                      type: DATE
                      mode: REQUIRED
                      description: First day of the month
                    - name: region
                      type: STRING
                      mode: REQUIRED
                      description: Sales region
                    - name: total_revenue
                      type: FLOAT
                      mode: REQUIRED
                      description: Total revenue for the month
                    - name: transaction_count
                      type: INTEGER
                      mode: REQUIRED
                      description: Number of transactions
                    - name: avg_order_value
                      type: FLOAT
                      mode: NULLABLE
                      description: Average order value
                  - dataset_id: customer_data
                    id: customers
                    description: Customer master data
                    fields:
                    - name: customer_id
                      type: STRING
                      mode: REQUIRED
                      description: Unique customer identifier
                    - name: email
                      type: STRING
                      mode: REQUIRED
                      description: Customer email address
                    - name: name
                      type: STRING
                      mode: REQUIRED
                      description: Customer full name
                    - name: created_at
                      type: TIMESTAMP
                      mode: REQUIRED
                      description: Account creation timestamp
                    - name: tier
                      type: STRING
                      mode: NULLABLE
                      description: Customer tier (bronze, silver, gold)
                    - name: lifetime_value
                      type: FLOAT
                      mode: NULLABLE
                      description: Customer lifetime value
                  - dataset_id: product_catalog
                    id: products
                    description: Product catalog
                    fields:
                    - name: product_id
                      type: STRING
                      mode: REQUIRED
                      description: Product identifier
                    - name: name
                      type: STRING
                      mode: REQUIRED
                      description: Product name
                    - name: category
                      type: STRING
                      mode: REQUIRED
                      description: Product category
                    - name: price
                      type: FLOAT
                      mode: REQUIRED
                      description: Current price
                    - name: stock_quantity
                      type: INTEGER
                      mode: REQUIRED
                      description: Available stock
                    - name: is_active
                      type: BOOLEAN
                      mode: REQUIRED
                      description: Whether product is active
                  buckets:
                  - name: sandbox-data-lake-123
                    location: US
                    storage_class: STANDARD
                    versioning_enabled: true
                    lifecycle_rules:
                    - action: Delete
                      age_days: 365
                  - name: sandbox-exports-123
                    location: US
                    storage_class: STANDARD
                    versioning_enabled: false
                  - name: sandbox-backups-123
                    location: US-EAST1
                    storage_class: NEARLINE
                    versioning_enabled: true
                    lifecycle_rules:
                    - action: SetStorageClass
                      action_storage_class: COLDLINE
                      age_days: 90
                    - action: Delete
                      age_days: 730
                  - name: sandbox-logs-archive-123
                    location: US
                    storage_class: ARCHIVE
                    versioning_enabled: false
                  objects:
                  - bucket: sandbox-data-lake-123
                    name: raw/sales/2025/01/daily_sales_20250101.csv
                    content_type: text/csv
                    content: 'transaction_id,sale_date,product_id,quantity,unit_price,total_amount,region

                      TXN001,2025-01-01,PROD001,5,19.99,99.95,North America

                      TXN002,2025-01-01,PROD002,3,29.99,89.97,Europe

                      TXN003,2025-01-01,PROD001,10,19.99,199.90,Asia Pacific'
                  - bucket: sandbox-data-lake-123
                    name: raw/sales/2025/01/daily_sales_20250102.csv
                    content_type: text/csv
                    content: 'transaction_id,sale_date,product_id,quantity,unit_price,total_amount,region

                      TXN004,2025-01-02,PROD003,2,49.99,99.98,North America

                      TXN005,2025-01-02,PROD001,7,19.99,139.93,Europe

                      TXN006,2025-01-02,PROD002,4,29.99,119.96,Asia Pacific'
                  - bucket: sandbox-data-lake-123
                    name: processed/customers/customer_segments.json
                    content_type: application/json
                    content: '{"segments": [{"name": "High Value", "count": 1500, "avgLTV": 2500}, {"name": "Medium Value", "count": 5000, "avgLTV": 800}, {"name": "Low Value", "count": 12000, "avgLTV": 150}]}'
                  - bucket: sandbox-exports-123
                    name: exports/monthly_report_202501.csv
                    content_type: text/csv
                    content: 'month,total_revenue,total_transactions,avg_order_value

                      2025-01,1250000.00,15000,83.33'
                  - bucket: sandbox-data-lake-123
                    name: config/etl_pipeline_config.yaml
                    content_type: application/x-yaml
                    content: "pipeline:\n  name: daily_sales_etl\n  schedule: \"0 2 * * *\"\n  source:\n    type: gcs\n    bucket: sandbox-data-lake-123\n    prefix: raw/sales/\n  destination:\n    type: bigquery\n    dataset: sales_analytics\n    table: daily_sales"
                  log_entries:
                  - log_name: application-logs
                    message: Application started successfully
                    severity: INFO
                    timestamp: '2025-01-15T08:00:00Z'
                    resource_type: gce_instance
                    resource_labels:
                      instance_id: '1234567890'
                      zone: us-central1-a
                  - log_name: application-logs
                    message: Database connection established
                    severity: INFO
                    timestamp: '2025-01-15T08:00:05Z'
                    resource_type: gce_instance
                    resource_labels:
                      instance_id: '1234567890'
                      zone: us-central1-a
                  - log_name: application-logs
                    json_data:
                      event: user_login
                      user_id: user_123
                      ip_address: 192.168.1.100
                      success: true
                    severity: INFO
                    timestamp: '2025-01-15T09:30:00Z'
                    resource_type: gce_instance
                    resource_labels:
                      instance_id: '1234567890'
                      zone: us-central1-a
                  - log_name: error-logs
                    message: 'Failed to process batch: timeout exceeded'
                    severity: ERROR
                    timestamp: '2025-01-15T14:22:00Z'
                    resource_type: cloud_function
                    resource_labels:
                      function_name: process_batch
                      region: us-central1
                  - log_name: audit-logs
                    json_data:
                      action: resource.create
                      resource_type: storage.bucket
                      resource_name: new-bucket
                      actor: admin@example.com
                    severity: NOTICE
                    timestamp: '2025-01-15T10:15:00Z'
                    resource_type: project
                  log_sinks:
                  - name: bigquery-audit-sink
                    filter: logName:"cloudaudit.googleapis.com"
                    description: Export audit logs for analysis
                  - name: error-logs-sink
                    filter: severity>=ERROR
                    description: Capture error logs
                  - name: all-logs-sink
                    description: Stream all logs for processing
                  log_buckets:
                  - name: app-logs-bucket5
                    location: global
                    retention_days: 30
                    description: Bucket for app logs with 30-day retention
                  - name: security-logs-bucket5
                    location: us-central1
                    retention_days: 365
                    description: Bucket for security logs with 1-year retention
                  instances:
                  - name: web-server-1
                    zone: us-central1-a
                    machine_type: e2-medium
                    description: Primary web server
                    labels:
                      environment: production
                      team: web
                  - name: web-server-2
                    zone: us-central1-b
                    machine_type: e2-medium
                    description: Secondary web server
                    labels:
                      environment: production
                      team: web
                  - name: database-server
                    zone: us-central1-a
                    machine_type: n2-standard-4
                    description: Main database server
                    labels:
                      environment: production
                      team: database
                  - name: dev-instance
                    zone: us-west1-a
                    machine_type: e2-micro
                    description: Development and testing instance
                    labels:
                      environment: development
                      team: engineering
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitializeSandboxResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /local-sandbox/google_cloud/{sandbox_id}/dump:
    get:
      tags:
      - local-sandbox
      summary: Export google_cloud sandbox data
      description: Export all data from the sandbox in the same format used for initialization.
