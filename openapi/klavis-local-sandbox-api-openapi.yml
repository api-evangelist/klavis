                          Mandatory actions:

                          1. At least one author must register for the conference with the ''Conference'' option checked.

                          2. At least one author needs to digitally sign the publication consent form.

                          3. The presenting author needs to digitally sign the consent form.

                          4. The corresponding author needs to sign the PMLR publication agreement form.

