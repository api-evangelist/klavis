apis:
- aid: klavis:mcp-platform
  name: Klavis MCP Platform API
  description: >-
    The Klavis API manages hosted MCP servers, OAuth flows for 50+ integrated services, Strata multi-tool
    servers, and live sandbox environments. Endpoints cover MCP server CRUD and tool invocation, sandbox
    VM acquisition and reset, data initialization and export, user and integration management, and white-label
    OAuth branding.
  humanURL: https://www.klavis.ai/docs
  baseURL: https://api.klavis.ai
  tags:
  - MCP Server
  - Strata
  - Sandbox
  - Authentication
  - Integration
  - White Label
  - User
  tags_raw:
  - MCP Servers
  - Strata
  - Sandboxes
  - OAuth
  - Integrations
  - White Label
  - Users
  properties:
  - type: Documentation
    url: https://www.klavis.ai/docs
  - type: APIReference
    url: https://www.klavis.ai/docs/api-reference
  - type: GettingStarted
    url: https://www.klavis.ai/docs/quickstart
  - type: Signup
    url: https://www.klavis.ai/home
  - type: SDKs
    url: https://pypi.org/project/klavis/
  - type: SDKs
    url: https://www.npmjs.com/package/klavis
  - type: GitHubRepository
    url: https://github.com/Klavis-AI/klavis
  - type: GitHubOrganization
    url: https://github.com/Klavis-AI
  - type: Pricing
    url: https://www.klavis.ai/pricing
  - type: LlmsText
    url: https://www.klavis.ai/docs/llms.txt
  features:
  - name: Hosted MCP Servers
    description: Create, manage, and call 100+ prebuilt MCP servers via REST endpoints.
  - name: Strata Unified Server
    description: >-
      Single MCP endpoint that intelligently routes across multiple tool integrations to fit LLM context
      windows.
  - name: OAuth for 50+ Services
    description: Built-in OAuth flows for Gmail, Slack, Salesforce, HubSpot, Notion, GitHub, and more.
  - name: White-Label OAuth
    description: Brand OAuth screens and bring your own credentials for customer-facing apps.
  - name: MCP Sandbox
    description: >-
      Scalable, isolated VMs with seeded state, resets, parallel isolation, and snapshot export for agent
      training.
  - name: Realistic Task Environments
    description: >-
      Long-horizon multi-app scenarios spanning browser, code, SaaS, and MCP servers with verifiable outcomes.
  - name: User & Integration Management
    description: Manage end users, stored credentials, and which integrations are exposed per agent.
  - name: Open Source Core
    description: Apache-2.0 codebase covering 100+ MCP servers and Strata.
  - name: Compliance
    description: SOC 2 Type II and GDPR posture for regulated deployments.
  useCases:
  - name: Production Agent Integrations
    description: >-
      Connect agents to Gmail, Slack, Salesforce, HubSpot, GitHub, Notion, and more without writing per-tool
      glue.
  - name: Agent RL and Evals
    description: >-
      Run reinforcement learning and evaluations in realistic multi-app sandboxes with verifiable outcomes.
  - name: White-Label MCP for SaaS
    description: Embed MCP-powered tools into your own product under your own brand.
  - name: Tool Context Optimization
    description: Use Strata to expose hundreds of tools to an LLM without overflowing context.
  - name: Self-Hosted MCP
    description: Deploy the open-source servers on your own infrastructure.
  integrations:
  - name: Claude
  - name: OpenAI
  - name: Gemini
  - name: Cohere
  - name: Mistral
  - name: LangChain
  - name: LangGraph
  - name: LlamaIndex
  - name: CrewAI
  - name: Mastra
  - name: Agno
  - name: Fireworks AI
  - name: Together AI
  - name: Google ADK
  - name: Claude Desktop
  - name: Cursor
  - name: VS Code
  - name: Continue
  authentication:
  - type: API Key
    description: >-
      Account API keys passed via the `Authorization: Bearer` header authenticate REST and SDK calls.
  - type: OAuth2
    description: >-
      Built-in OAuth 2.0 flows handle credentials for 50+ third-party services on behalf of end users.
